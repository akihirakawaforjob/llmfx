[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfx"
version = "0.1.0"
description = "Dow-theory reversal trading system for FX with an LLM review layer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llmfx = "llmfx.cli:main"

[tool.setuptools.packages.find]
include = ["llmfx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
